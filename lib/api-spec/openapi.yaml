        label: { type: string }
        description: { type: string }

    DiplomacyTreaty:
      type: object
      required:
        [
          id,
          type,
          typeLabel,
          proposerNationId,
          proposerName,
          targetNationId,
          targetName,
          offerMoney,
          offerTechPoints,
          offerRegionIds,
          status,
          isCounter,
          awaitingMe,
          perTurnMoney,
          perTurnTech,
          perTurnProduction,
          perTurnFood,
          perTurnWood,
          perTurnOre,
          requestPerTurnMoney,
          requestPerTurnTech,
          requestPerTurnProduction,
          requestPerTurnFood,
          requestPerTurnWood,
          requestPerTurnOre,
          proposerIsPayer,
          createdAt,
        ]
      properties:
        id: { type: integer }
        type: { type: string }
        typeLabel: { type: string }
        proposerNationId: { type: string }
        proposerName: { type: string }
        targetNationId: { type: string }
        targetName: { type: string }
        durationDays: { type: integer, nullable: true }
        offerMoney: { type: integer }
        offerTechPoints: { type: integer }
        offerWood: { type: integer, description: "Task #406 — 我方提供的一次性木材" }
        offerOre: { type: integer, description: "Task #406 — 我方提供的一次性礦石" }
        offerRegionIds:
          type: array
          items: { type: integer }
        offerRegionPercents:
          type: object
          additionalProperties: { type: integer }
          description: >-
            以地區 id（字串鍵）對應付方讓出的百分比（1–100）。缺項或 100 表示整個掌控份額轉移，
            介於 1–99 表示部分割讓。附條件停戰／部分割地時使用。
        requestMoney: { type: integer }
        requestTechPoints: { type: integer }
        requestWood: { type: integer, description: "Task #406 — 要求對方提供的一次性木材" }
        requestOre: { type: integer, description: "Task #406 — 要求對方提供的一次性礦石" }
        requestRegionIds:
          type: array
          items: { type: integer }
          description: 要求對方（被提案方）割讓的地區 id 清單。
        requestRegionPercents:
          type: object
          additionalProperties: { type: integer }
          description: 以地區 id（字串鍵）對應要求對方讓出的百分比（1–100）。
        boundWarId:
          type: integer
          nullable: true
          description: >-
            若此條約為「附條件停戰」，為其綁定的戰爭 id；玩家接受後該場戰爭立即結束。否則為 null。
        status:
          type: string
          enum: [proposed, active, rejected, expired, superseded, annulled, withdrawn]
        isCounter: { type: boolean }
        responseNote: { type: string, nullable: true }
        awaitingMe: { type: boolean }
        customClause: { type: string, nullable: true }
        perTurnMoney: { type: integer }
        perTurnTech: { type: integer }
        perTurnProduction: { type: integer }
        perTurnFood:
          type: integer
          description: 每回合輸送糧食（流量；輸出方不做餘額檢查，不夠吃也照送）。

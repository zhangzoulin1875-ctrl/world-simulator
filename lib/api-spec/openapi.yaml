    GameNewsItem:
      type: object
      required: [id, gameDate, year, era, eraLabel, category, title, body, createdAt]
      properties:
        id: { type: string }
        gameDate: { type: string }
        year: { type: integer }
        era: { type: string }
        eraLabel: { type: string }
        category:
          type: string
          enum: [war, treaty, era, rise_fall, politics, world]
        title: { type: string }
        body: { type: string }
        createdAt: { type: string }

    GameNewsResponse:
      type: object
      required: [news]
      properties:
        news:
          type: array
          items: { $ref: "#/components/schemas/GameNewsItem" }

    UnownedNationRegion:
      type: object
      required: [id, name, percent]
      properties:
        id: { type: integer }
        name: { type: string }
        percent: { type: integer }

    UnownedNation:
      type: object
      required: [id, name, leaderName, government, flagUrl, emblemUrl, regions]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        leaderName: { type: string, nullable: true }
        government: { type: string, nullable: true }
        flagUrl: { type: string, nullable: true }
        emblemUrl: { type: string, nullable: true }
        regions:
          type: array
          items: { $ref: "#/components/schemas/UnownedNationRegion" }

    UnownedNationsResponse:
      type: object
      required: [nations]
      properties:
        nations:
          type: array
          items: { $ref: "#/components/schemas/UnownedNation" }

    PlayerNotification:
      type: object
      required: [id, type, title, body, linkPath, createdAt, read]
      properties:
        id: { type: string }
        type: { type: string, description: '事件類型（例如 "diplomacy"）' }
        title: { type: string }
        body: { type: string }
        linkPath:
          {
            type: string,
            nullable: true,
            description: '站內跳轉路徑（例如 "/game/diplomacy"）；null = 不可點擊',
          }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    PlayerNotificationsResponse:
      type: object
      required: [unreadCount, notifications]
      properties:
        unreadCount: { type: integer }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/PlayerNotification" }

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          maxItems: 200
          items: { type: string }

        buildingSlotsPerCity:
          type: integer
          description: 每座城市的建築槽上限（彙總社會關鍵技術後夾至硬上限；未啟用為 0）。
        buildingSlotsMax:
          type: integer
          description: 建築槽硬上限（30）。
        cityWallEnabled:
          type: boolean
          description: 城牆升級是否已解鎖（需生產關鍵技術「風車技術」；木牆為預設起點）。
        wallTiers:
          type: array
          description: 城牆四階級的耐久上限、防禦加成與升級成本（目錄，供 UI 顯示）。

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: bot
  - name: auth
  - name: map
  - name: player
  - name: military
  - name: politics
  - name: economy
  - name: war
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/token:
    post:
      operationId: setBotToken
      tags: [bot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 10
      responses:
        "200":
          description: Token accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  username: { type: string }
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok: { type: boolean }
                  error: { type: string }

  /bot/restart:
    post:
      operationId: restartBot
      tags: [bot]
      description: Restart the Discord bot using the stored token. Requires admin auth.
      responses:
        "200":
          description: Restart triggered
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400":
          description: No token configured
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
        "401":
          description: Unauthorized
        "500":
          description: Restart failed
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok: { type: boolean }
                  error: { type: string }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current Discord login session
      responses:
        "200":
          description: Current user (or unauthenticated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current Discord session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /player/founding-governments:
    get:
      operationId: listFoundingGovernments
      tags: [player]
      summary: 建國可選政體（三選一）清單，含決策難度等量化提示（後端 SSOT）
      responses:
        "200":
          description: Founding government options
          content:
            application/json:
              schema:
                type: object
                required: [governments, foundingProductionCap]
                properties:
                  governments:
                    type: array
                    items: { $ref: "#/components/schemas/FoundingGovernment" }
                  foundingProductionCap:
                    type: integer
                    description: 選 2–3 塊起始地區時的生產力（productivity × population / 1,000,000）加總上限；選 1 塊不受限
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/nation:
    get:
      operationId: getPlayerNation
      tags: [player]
      summary: Current player's nation (hasNation=false when the player has not founded one)
      responses:
        "200":
          description: Nation envelope — nation is null until the player founds or claims one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerNationEnvelope" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    post:
      operationId: foundNation
      tags: [player]
      summary: 建國 — create a nation on an unclaimed start region (100% control)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FoundNationRequest" }
      responses:
        "201":
          description: Nation founded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerNationEnvelope" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: Region already controlled, or the player already owns a nation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    patch:
      operationId: updatePlayerNation
      tags: [player]
      summary: 更新國家設定（政體建國後鎖定，不可修改）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNationRequest" }
      responses:
        "200":
          description: Updated nation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerNationEnvelope" }
        "400":
          description: Validation error (including attempts to change government)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: 尚未建國
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deletePlayerNation
      tags: [player]
      summary: 刪除國家 — removes the nation, its region controls and the player's military
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: 尚未建國
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/nation/advisor-tips:
    post:
      operationId: generateAdvisorTips
      tags: [player]
      summary: 產生看板顧問小tips — 依已存的說話風格用 AI 一次生成 20–30 則（AI 失敗保留原本）
      responses:
        "200":
          description: Tips generated; returns the updated nation envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerNationEnvelope" }
        "400":
          description: 尚未設定說話風格
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: 尚未建國
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "429":
          description: Too many AI requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "502":
          description: AI 產生失敗（已保留原本的tips）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/nation/stat-breakdown:
    get:
      operationId: getNationStatBreakdown
      tags: [player]
      summary: 數值來源明細（生產力/科技/人口/內政的逐層組成 + 各地區貢獻）
      responses:
        "200":
          description: Structured stat source breakdown for the player's nation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NationStatBreakdown" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: 尚未建國
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/nation/quit:
    post:
      operationId: quitNation
      tags: [player]
      summary: 退出國家 — the nation becomes ownerless (claimable); the player's military is disbanded
      responses:
        "200":
          description: Quit successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: 尚未建國
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/unowned-nations:
    get:
      operationId: listUnownedNations
      tags: [player]
      summary: 無主國家清單（接手用）
      responses:
        "200":
          description: Ownerless nations with their controlled regions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnownedNationsResponse" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/unowned-nations/{id}/claim:
    post:
      operationId: claimUnownedNation
      tags: [player]
      summary: 接手無主國家（race-safe conditional claim）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nation claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerNationEnvelope" }
        "400":
          description: Invalid nation id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Nation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: Already owns a nation, or the nation was just claimed by someone else
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/notifications:
    get:
      operationId: listPlayerNotifications
      tags: [player]
      summary: 站內通知清單（新到舊）＋未讀數（Task #79 鈴鐺通知中心）
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Notifications (newest first) with unread count
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PlayerNotificationsResponse" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /player/notifications/read:
    post:
      operationId: markPlayerNotificationsRead
      tags: [player]
      summary: 標為已讀（ids 省略 = 全部未讀標為已讀）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/MarkNotificationsReadRequest" }
      responses:
        "200":
          description: Marked as read; returns updated unread count
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/MarkNotificationsReadResponse" }
        "400":
          description: Invalid ids
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /game/governments:
    get:
      operationId: listGovernments
      tags: [player]
      summary: 12 種政體（當前時代推薦排前）
      responses:
        "200":
          description: Governments with era recommendations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernmentsResponse" }

  /game/claimed-regions:
    get:
      operationId: listClaimedRegions
      tags: [player]
      summary: 已被任一國家掌控的地區 id 清單（建國選地用）
      responses:
        "200":
          description: Region ids with at least one control row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimedRegionsResponse" }

  /game/news:
    get:
      operationId: listGameNews
      tags: [player]
      summary: 每回合 AI 整理的重大國際／各國新聞（公開唯讀，新到舊）
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Latest curated game news, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNewsResponse" }

  /military/overview:
    get:
      operationId: getMilitaryOverview
      tags: [military]
      summary: Military overview — categories, templates (tech-adjusted), armies, techs, quota, resources
      responses:
        "200":
          description: Full military state for the logged-in player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilitaryOverview" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/recruit:
    post:
      operationId: recruitMilitaryUnits
      tags: [military]
      summary: Recruit units — atomically deducts production and population
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilitaryOrderRequest" }
      responses:
        "200":
          description: Recruit completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilitaryOrderResult" }
        "400":
          description: Validation / insufficient resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Template not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/purchase:
    post:
      operationId: purchaseMilitaryUnits
      tags: [military]
      summary: Buy units with money — daily quota ≈ 1% of population, atomic money deduction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilitaryOrderRequest" }
      responses:
        "200":
          description: Purchase completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilitaryOrderResult" }
        "400":
          description: Validation / quota exceeded / insufficient money
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Template not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/design-unit:
    post:
      operationId: designMilitaryUnit
      tags: [military]
      summary: AI custom unit design — costs 1 design charge (refunded on AI failure)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilitaryDesignRequest" }
      responses:
        "200":
          description: Designed unit template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilitaryDesignResult" }
        "400":
          description: Validation / no design charges left / category locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "502":
          description: AI generation failed (charge refunded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/design-weapon:
    post:
      operationId: designMilitaryWeapon
      tags: [military]
      summary: AI 武器設計（含獨一無二的特殊技能）— 消耗 1 次武器設計次數（AI 失敗退還）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeaponDesignRequest" }
      responses:
        "200":
          description: Designed weapon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeaponDesignResult" }
        "400":
          description: Validation / no charges / weapon cap reached / requirement rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "502":
          description: AI generation failed (charge refunded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/equip-weapon:
    post:
      operationId: equipMilitaryWeapon
      tags: [military]
      summary: 兵種裝備／卸除武器（不相容仍可裝備，戰鬥時受懲罰）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeaponEquipRequest" }
      responses:
        "200":
          description: Equip result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeaponEquipResult" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Template or weapon not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/weapons/{id}:
    delete:
      operationId: deleteMilitaryWeapon
      tags: [military]
      summary: 銷毀武器（不退設計次數；已裝備兵種自動卸除）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeaponDeleteResult" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Weapon not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /tech-tree/overview:
    get:
      operationId: getTechTreeOverview
      tags: [tech-tree]
      summary: Task #469 — 全球統一線性科技樹總覽（三領域節點狀態、進行中研發、分配比例）
      responses:
        "200":
          description: Tech tree state for the logged-in player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechTreeOverview" }
        "400":
          description: No nation founded yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /tech-tree/research:
    post:
      operationId: startTechTreeResearch
      tags: [tech-tree]
      summary: 選定科技樹節點開始研發（成本以當下倍率快照鎖定；同領域一次一項）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId]
              properties:
                nodeId: { type: integer }
      responses:
        "200":
          description: Research started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechTreeResearchStartResult" }
        "400":
          description: Locked / already researched / already researching another node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Node not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /tech-tree/cancel:
    post:
      operationId: cancelTechTreeResearch
      tags: [tech-tree]
      summary: 取消該領域進行中研發（累積進度作廢，不退點）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, description: "social|production|military" }
      responses:
        "200":
          description: Research cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechTreeCancelResult" }
        "400":
          description: Invalid domain / nothing in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /tech-tree/allocation:
    put:
      operationId: setTechTreeAllocation
      tags: [tech-tree]
      summary: 設定三領域科研點數分配比例（整數 %，合計須為 100）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TechTreeAllocation" }
      responses:
        "200":
          description: Allocation updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechTreeAllocationResult" }
        "400":
          description: Percentages not integers 0-100 summing to 100
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/templates/{id}/name:
    patch:
      operationId: renameMilitaryUnit
      tags: [military]
      summary: Per-player rename of a visible unit template — null/empty clears back to the original name
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                  maxLength: 40
                  description: New display name; null or empty clears the customization.
      responses:
        "200":
          description: Rename applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilitaryRenameResult" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Template not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /military/templates/{id}:
    delete:
      operationId: deleteMilitaryUnitTemplate
      tags: [military]
      summary: Delete an own custom unit template — its armies are removed too; no refunds
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [templateId, deleted]
                properties:
                  templateId: { type: integer }

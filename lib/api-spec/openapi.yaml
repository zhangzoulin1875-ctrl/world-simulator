        direction: { type: string, description: "general（新制綜合）|law|culture|religion|rights（舊制遺留）" }
        directionLabel:
          type: string
          nullable: true
          description: 舊制方向條目的方向標籤（秩序|文化|宗教|人權）；新制 general 條目為 null。
        entryType: { type: string, description: "policy|tradition|reform|event" }
        entryTypeLabel: { type: string, description: "政策|傳統|變革|事件" }
        title: { type: string }
        description: { type: string }
        modifiers:
          type: array
          items: { $ref: "#/components/schemas/PoliticsModifier" }
        durationTurns: { type: integer, nullable: true, description: "null = 永久" }
        remainingTurns: { type: integer, nullable: true }
        status: { type: string, description: "active|expired|repealed|failed" }
        strength:
          type: number
          description: 目前強度 0–1（變革/事件按 remaining/duration 線性淡化）。
        createdAt: { type: string }

    PoliticsPendingIdea:
      type: object
      required: [id, idea, createdAt]
      properties:
        id: { type: integer }
        idea: { type: string }
        createdAt: { type: string }

    PoliticsDirectionTotals:
      type: object
      required: [satisfaction, stability, production, tech, populationGrowth]
      properties:
        satisfaction: { type: number, description: "固定點數加總" }
        stability: { type: number, description: "固定點數加總" }
        production: { type: number, description: "百分比加總" }
        tech: { type: number, description: "百分比加總" }
        populationGrowth: { type: number, description: "人口增長率百分點加總" }

    PoliticsDirectionState:
      type: object
      required:
        [
          direction,
          label,
          satisfactionLabel,
          enabled,
          satisfaction,
          baseSatisfaction,
          totals,
        ]
      properties:
        direction: { type: string, description: "law|culture|religion|rights" }
        label: { type: string, description: "秩序|文化|宗教|人權" }
        satisfactionLabel: { type: string }
        enabled:
          type: boolean
          description: 該方向是否已解鎖（宗教需世界宗教科技、人權需君權神授科技；未解鎖前端灰化）。
        satisfaction: { type: number, description: "有效滿意度 0–100（最多小數點第一位）" }
        baseSatisfaction: { type: integer, description: "基底滿意度（未含加減成）" }
        totals: { $ref: "#/components/schemas/PoliticsDirectionTotals" }

    PoliticsPendingDecision:
      type: object
      required: [id, decision, createdAt]
      properties:
        id: { type: integer }
        decision: { type: string }
        createdAt: { type: string }

    PoliticsUnlockedGovernment:
      type: object
      required: [slug, label]
      properties:
        slug: { type: string }
        label: { type: string }

    PoliticsSocialFlags:
      type: object
      required:
        [religionEnabled, rightsEnabled, advisorSlotEnabled, unlockedGovernments]
      properties:
        religionEnabled:
          type: boolean
          description: 宗教滿意度是否解鎖（世界宗教科技）。
        rightsEnabled:
          type: boolean
          description: 人權滿意度是否解鎖（君權神授科技）。
        advisorSlotEnabled:
          type: boolean
          description: 顧問欄位是否解鎖（政治哲學科技）。
        unlockedGovernments:
          type: array
          description: 社會關鍵科技已解鎖、可透過政體變更接受度切換的政體清單。
          items: { $ref: "#/components/schemas/PoliticsUnlockedGovernment" }

    PoliticsOverview:
      type: object
      required:
        [
          stability,
          unrest,
          warWeariness,
          attackModifierPct,
          stabilityBonusPct,
          populationGrowthRatePct,
          ideaMaxLength,
          government,
          politicalNote,
          politicalSupport,
          governmentChangeAcceptance,
          decisionMaxLength,
          decisionDifficulty,
          pendingDecision,
          social,
          pendingIdea,
          activeEntries,
          history,
          directions,
          military,
          coupPolicyLockTurns,
        ]
      properties:
        stability: { type: number, description: "有效穩定度 0–100（最多小數點第一位）" }
        unrest: { type: integer, description: "有效暴動度 0–100" }
        warWeariness: { type: integer, description: "厭戰度 0–100" }
        attackModifierPct: { type: integer, description: "厭戰度攻擊修正 %" }
        stabilityBonusPct:
          type: integer
          description: 穩定度造成的科技/生產加減成 %（-30 ～ +30）。
        populationGrowthRatePct:
          type: number
          description: 有效人口增長率（%／回合；基礎 + 加減成，夾 ±上限）。
        ideaMaxLength: { type: integer, description: "政策想法字數上限（管理員可調）" }
        government: { type: string, description: "目前政體（zh-TW 標籤）" }
        politicalNote:
          type: string
          nullable: true
          description: 政治註記（AI 治理摘要，所有政治 AI 呼叫共用；政體變更時重生）。
        politicalSupport:
          type: number
          description: 政治支持度 0–100（影響決策成功率與反效果；最多小數點第一位）。
        governmentChangeAcceptance:
          type: number
          description: 政體變更接受度 0–100（達 100 主動變更政體；最多小數點第一位）。
        coupPolicyLockTurns:
          type: integer
          description: "Task #584 — 政變後政策封鎖剩餘回合數（> 0 時無法提交政策想法／政府決策）"
        decisionMaxLength: { type: integer, description: "政府決策字數上限（管理員可調）" }
        decisionDifficulty:
          type: number
          description: 目前政體的決策難度（影響 AI 判定成功率）。
        pendingDecision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PoliticsPendingDecision"
        social: { $ref: "#/components/schemas/PoliticsSocialFlags" }
        pendingIdea:
          nullable: true
          description: Task #393 — 全國唯一一筆待判定政策想法（不分方向）。
          allOf:
            - $ref: "#/components/schemas/PoliticsPendingIdea"
        activeEntries:
          type: array
          description: 統一條目清單（生效中；最新在前）。
          items: { $ref: "#/components/schemas/PoliticsEntry" }
        history:
          type: array
          description: 統一條目清單（含已結束/失敗；最新在前，最多 60 筆）。
          items: { $ref: "#/components/schemas/PoliticsEntry" }
        directions:
          type: array
          items: { $ref: "#/components/schemas/PoliticsDirectionState" }
        military: { $ref: "#/components/schemas/PoliticsMilitaryInfo" }

    PoliticsMilitaryInfo:
      type: object
      description: Task #402 — 軍方面向（服從度、軍隊占人口比與風險等級）。
      required: [obedience, armyPopulationRatioPct, thresholdPct, riskLevel, riskLabel]
      properties:
        obedience: { type: integer, description: "軍方服從度 0–100（新建軍團初始士氣）" }
        armyPopulationRatioPct:
          type: number
          description: 軍隊占人口比 %（最多小數點第一位）。
        thresholdPct: { type: integer, description: "軍隊越權門檻 %（超過可能觸發越權事件）" }
        riskLevel:
          type: string
          enum: [low, medium, high]
          description: 軍方風險等級。
        riskLabel: { type: string, description: "風險等級 zh-TW 標籤" }

    PoliticsHistoryEntry:
      type: object
      required: [id, eventType, title, description, createdAt]
      properties:
        id: { type: integer }
        eventType:
          type: string
          description: 事件類型（decision|government_change|coup|...）。
        title: { type: string }
        description: { type: string }
        createdAt: { type: string }

    PoliticsHistoryResponse:
      type: object
      required: [history]
      properties:
        history:
          type: array
          items: { $ref: "#/components/schemas/PoliticsHistoryEntry" }

    SubmitPolicyIdeaRequest:
      type: object
      required: [idea]
      properties:
        idea: { type: string, minLength: 1, description: "政策想法（不分方向；上限由管理設定決定）" }

    SubmitGovernmentDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          minLength: 1
          description: 政府決策自由文字（上限由管理設定決定）。

    ChangeGovernmentRequest:
      type: object
      required: [government]
      properties:
        government:
          type: string
          minLength: 1
          description: 目標政體 slug（須為社會關鍵科技已解鎖者）。

    FinancePendingIdea:
      type: object
      required: [id, idea, createdAt]
      properties:
        id: { type: integer }
        idea: { type: string }
        createdAt: { type: string }

    FinanceEntry:
      type: object
      required:
        [
          id,
          title,
          description,
          isGood,
          taxRateBefore,
          taxRateAfter,
          moneyDelta,
          satisfactionDelta,
          stabilityDelta,
          createdAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        isGood: { type: boolean, description: "true = 好事件、false = 壞事件" }
        taxRateBefore: { type: integer, nullable: true, description: "調整前稅率 %" }
        taxRateAfter: { type: integer, nullable: true, description: "調整後稅率 %" }
        moneyDelta: { type: number, nullable: true, description: "一次性金錢變動（有號）" }
        satisfactionDelta:
          { type: integer, nullable: true, description: "四大階級滿意度整體偏移" }
        stabilityDelta: { type: integer, nullable: true, description: "穩定度偏移" }
        createdAt: { type: string }

    MilitaryUpkeepLine:
      type: object
      required: [templateId, name, quantity, upkeepPerUnit, subtotal]
      properties:
        templateId: { type: integer, description: "兵種模板 id" }
        name: { type: string, description: "兵種名稱" }
        quantity: { type: number, description: "持有數量" }
        upkeepPerUnit: { type: number, description: "每單位每回合維護費" }
        subtotal: { type: number, description: "小計 = 數量 × 每單位維護費" }

    FoodRegionLine:
      type: object
      required: [regionId, name, fertility, controlledAreaKm2, controlledPopulation, farmers, output]
      properties:
        regionId: { type: integer }
        name: { type: string }
        fertility:
          type: integer
          nullable: true
          description: 土壤肥沃度（0–120；null = 資料缺失，產出視為 0）
        controlledAreaKm2:
          { type: integer, description: "該區控制面積 km²（地區面積 × 控制比例，四捨五入）" }
        controlledPopulation: { type: integer, description: "該區控制人口（含累積成長量）" }
        farmers:
          { type: integer, description: "該區農民數（控制人口 × 農民比例；僅供顯示，不參與產出）" }
        output: { type: number, description: "該區糧食產出（未含政策修正）" }

    FoodProductionSummary:
      type: object
      required: [base, total]
      properties:
        base: { type: number, description: "基礎產出（Σ 各區 控制面積 × 肥沃度 × 時代指數 × 農民比例 × 校準常數）" }
        total: { type: number, description: "套用政策/科技修正後的總產出" }

    FoodConsumptionSummary:
      type: object
      required: [civilian, military, total]
      properties:
        civilian: { type: number, description: "平民消耗（每人口 1，節約配給 −10%）" }
        military: { type: number, description: "軍人消耗（每人基礎 5，軍糧科技可減，下限 1）" }
        total: { type: number }

    FoodPolicies:
      type: object
      required:
        [mobilization, rationing, outputBonusPct, rationSavingPct, satisfactionCostPerTurn]
      properties:
        mobilization: { type: boolean, description: "增產動員（產出 +10%）" }
        rationing: { type: boolean, description: "節約配給（平民消耗 −10%）" }
        outputBonusPct: { type: integer }
        rationSavingPct: { type: integer }
        satisfactionCostPerTurn:
          { type: integer, description: "每項政策啟用期間每回合四階級滿意度成本" }

    FoodOverview:
      type: object
      required:
        [
          eraSlug,
          eraIndex,
          farmerPct,
          population,
          soldiers,
          civilians,
          production,
          consumption,
          treaty,
          balance,
          famine,
          faminePopulationLossPct,
          consecutiveFamineTurns,
          currentFamineLossPct,
          famineSurvivorFloor,
          policies,
          regions,
        ]
      properties:
        eraSlug: { type: string, description: "數據時代 slug" }
        eraIndex: { type: number, description: "糧食時代指數（古典 0.1 → 未來 20）" }
        farmerPct: { type: integer, description: "農民佔總人口 %（0–100）" }
        population: { type: integer, description: "總人口" }
        soldiers: { type: integer, description: "軍人數 = Σ 軍隊數量 × 兵種人口消耗" }
        civilians: { type: integer, description: "平民數 = 總人口 − 軍人數（下限 0）" }
        production: { $ref: "#/components/schemas/FoodProductionSummary" }
        consumption: { $ref: "#/components/schemas/FoodConsumptionSummary" }
        treaty: { $ref: "#/components/schemas/FoodTreatyFlows" }
        balance:
          type: number
          description: "結餘 = 供給（產出＋條約輸入−條約輸出）− 消耗（非累積，不儲存）"
        famine: { type: boolean, description: "供給 < 消耗 → 飢荒（每日回合扣人口）" }
        faminePopulationLossPct:
          { type: integer, description: "全額扣幅 %（連續饑荒緩衝觸發前）" }
        consecutiveFamineTurns:
          { type: integer, description: "目前已連續饑荒的回合數（非饑荒回合會歸零）" }
        currentFamineLossPct:
          type: number
          description: "本回合實際扣幅 %：連續饑荒超過 2 回合後每回合減半，下限 2%"
        famineSurvivorFloor:
          { type: integer, description: "生還者保底：饑荒不會把人口扣到低於此值" }
        policies: { $ref: "#/components/schemas/FoodPolicies" }
        regions:
          type: array
          items: { $ref: "#/components/schemas/FoodRegionLine" }

    FoodTreatyFlows:
      type: object
      required: [inflow, outflow]
      description: 條約糧食輸送流量（生效自訂條約；輸出方不做餘額檢查）。
      properties:
        inflow: { type: integer, description: "每回合自條約收到的糧食" }
        outflow: { type: integer, description: "每回合依條約送出的糧食" }

    FoodPolicyUpdate:
      type: object
      description: 至少需指定一項政策開關。
      properties:
        mobilization: { type: boolean }
        rationing: { type: boolean }

    FoodPolicyState:
      type: object
      required: [mobilization, rationing]
      properties:
        mobilization: { type: boolean }
        rationing: { type: boolean }

    EconomyOverview:
      type: object
      required:
        [
          money,
          taxRatePct,
          taxRateMax,
          taxEfficiencyPct,
          totalPopulation,
          taxIncomePerTurn,
          surplusPerTurn,
          militaryUpkeepLines,
          militaryUpkeepPerTurn,
          buildingUpkeepPerTurn,
          regionBuildingUpkeepPerTurn,
          upkeepPerTurn,
          netSurplusPerTurn,
          availableProduction,
          ideaMaxLength,
          pendingIdea,
          entries,
        ]
      properties:
        money: { type: number, description: "目前國庫" }
        taxRatePct: { type: integer, description: "目前人口稅率 %（只能透過財政政策調整）" }
        taxRateMax: { type: integer, description: "稅率上限 %" }
        taxEfficiencyPct:
          { type: integer, description: "當前時代有效稅收效率 %（含國家加成）" }
        totalPopulation: { type: integer, description: "總人口（未扣除軍事佔用）" }
        taxIncomePerTurn:
          type: number
          description: 每回合預估稅收 = ⌊人口 × 稅率% × 稅收效率% ÷ 10000⌋。
        surplusPerTurn:
          type: number
          description: >-
            （相容欄位）每回合結餘 = 稅收，「不含」維護費，僅供舊用戶端相容；
            前端顯示請改用含維護費的 netSurplusPerTurn。
        militaryUpkeepLines:
          type: array
          description: 軍隊維護費逐兵種明細（依小計由大到小）。
          items: { $ref: "#/components/schemas/MilitaryUpkeepLine" }
        militaryUpkeepPerTurn:
          type: number
          description: 軍隊維護費每回合總計 = Σ（各兵種數量 × 每單位維護費）。
        buildingUpkeepPerTurn:
          type: number
          description: 建築每回合維護費總額（已含風車技術等減免）。
        regionBuildingUpkeepPerTurn:
          type: number
          description: 地區資源建築（木材廠／礦場）每回合金錢維護費總額（100 × Σ 等級）。
        upkeepPerTurn:
          type: number
          description: >-
            每回合實際扣除的維護費 = ⌈軍隊維護費 ＋ 建築維護費 ＋ 地區資源建築維護費⌉
            （與回合引擎一致，合併後無條件進位）。
        netSurplusPerTurn:
          type: number
          description: >-
            每回合淨結餘（含維護費）= 稅收 −（軍隊 ＋ 建築 ＋ 地區資源建築維護費），
            與回合引擎實際扣款一致。
        availableProduction:
          type: number
          description: >-
            Task #568 — 目前可用生產力 = 總生產力 − 已佔用 − 本回合招募花費
            （下限 0）。
        ideaMaxLength: { type: integer, description: "財政政策字數上限" }
        pendingIdea:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FinancePendingIdea"
        entries:
          type: array
          items: { $ref: "#/components/schemas/FinanceEntry" }

    SubmitFinanceIdeaRequest:
      type: object
      required: [idea]
      properties:
        idea: { type: string, minLength: 1, description: "財政政策自由文字（上限 200 字）" }

    FinanceLedgerEntry:
      type: object
      required: [id, category, categoryLabel, amount, description, createdAt]
      properties:
        id: { type: integer }
        category: { type: string, description: "treaty|gift|policy_penalty|coup|fiscal_policy" }
        categoryLabel: { type: string, description: "分類中文標籤" }
        amount: { type: number, description: "有號金額：正 = 收入、負 = 支出" }
        description: { type: string }
        createdAt: { type: string }

    EconomyLedger:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/FinanceLedgerEntry" }

    BuildingEffect:
      type: object
      required: [target, value, label]
      properties:
        target:
          type: string
          description: "productivity|techPoints|populationGrowth"
        value: { type: integer }
        label: { type: string, description: "zh-TW display string" }

    CityBuilding:
      type: object
      required: [id, type, name]
      properties:
        id: { type: integer }
        type: { type: string, description: "建築類型 slug（對應 BUILDINGS）" }
        name: { type: string, description: "建築中文名" }

    AvailableBuilding:
      type: object
      required: [type, name, description, buildCost, upkeep, unlocked, effects]
      properties:
        type: { type: string }
        name: { type: string }
        description: { type: string }
        buildCost: { type: integer, description: "建造成本（金錢）" }
        upkeep: { type: integer, description: "每回合維護費（金錢；風車技術可減免）" }
        unlocked: { type: boolean, description: "是否已由生產關鍵技術解鎖" }
        effects:
          type: array
          items: { $ref: "#/components/schemas/BuildingEffect" }

    EconomyCity:
      type: object
      required: [id, name, slotsUsed, buildings, wall]
      properties:
        id: { type: integer }
        name: { type: string, description: "城市中文名" }
        slotsUsed: { type: integer, description: "已使用的建築槽數（＝該城建築數）" }
        buildings:
          type: array
          items: { $ref: "#/components/schemas/CityBuilding" }
        wall: { $ref: "#/components/schemas/EconomyCityWall" }

    EconomyCityWall:
      type: object
      required:
        [
          tier,
          tierLabel,
          maxDurability,
          defenseBonusPct,
          nextTier,
          nextTierLabel,
          upgradeCost,
          nextTierUnlocked,
          canUpgrade,
        ]
      properties:
        tier:
          type: string
          enum: [wood, stone, bunker, concrete]
          description: "目前城牆階級（未升級為木牆）"
        tierLabel: { type: string, description: "目前階級中文標籤" }
        maxDurability: { type: integer, description: "目前階級的城牆耐久上限" }
        defenseBonusPct:
          type: integer
          description: "目前階級給守軍的防禦加成（%，非累加）"
        nextTier:
          type: string
          nullable: true
          enum: [wood, stone, bunker, concrete]
          description: "下一階級（已達最高階為 null）"
        nextTierLabel: { type: string, nullable: true }
        upgradeCost:
          type: integer
          nullable: true
          description: "升級到下一階級所需金錢（無下一階為 null）"
        nextTierUnlocked:
          type: boolean
          description: "下一階級是否已由生產科技/時代解鎖"
        canUpgrade:
          type: boolean
          description: "是否可升級（有下一階且已解鎖；金錢在送出時才驗）"

    WallTierInfo:
      type: object
      required: [tier, label, maxDurability, defenseBonusPct, upgradeCost]
      properties:
        tier:
          type: string
          enum: [wood, stone, bunker, concrete]
        label: { type: string, description: "階級中文標籤" }
        maxDurability: { type: integer, description: "城牆耐久上限" }
        defenseBonusPct: { type: integer, description: "守軍防禦加成（%）" }

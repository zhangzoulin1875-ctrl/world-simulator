      type: object
      required:
        [id, name, isNpc, isUnowned, flagUrl, mapColor, government, population, armyPopulation, woundedPopulation, committedPopulation, armyTrend, money, techPoints]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        isNpc: { type: boolean }
        # 無主國家（未綁定玩家且非 NPC）；攻打其領土會即時建國成 NPC 應戰。
        isUnowned: { type: boolean }
        # Task #58 — 地圖顯示用：國旗網址（未設定為 null，前端退回僅顯示國名）。
        flagUrl: { type: string, nullable: true }
        # 玩家自訂地圖顏色（#rrggbb）；null = 前端依國家建立順序退回預設調色盤。
        mapColor: { type: string, nullable: true }
        # 政體標籤（已存 zh-TW；未建國/未設定時為 null）。
        government: { type: string, nullable: true }
        # 大略人口：Σ(控制比例 × 該數據時代地區人口) + 人口增長累積量，整數、下限 0。
        population: { type: integer }
        # 軍隊人口數：Σ(部隊數量 × 兵種每單位人口成本 popCostPerUnit)，涵蓋現役部隊
        # 與全國傷兵池（傷兵仍屬軍隊編制）。整數、下限 0。刻意只回傳單一聚合值，
        # 不外洩各兵種數量或編制；NPC／無主國家無常備軍為 0。
        armyPopulation: { type: integer }
        # Task #400 — 傷兵占用人口（玩家全國傷兵池＋NPC 恢復池；popCostPerUnit 口徑）。整數、下限 0。
        woundedPopulation: { type: integer }
        # Task #400 — 前線（戰役中）占用人口（玩家＝軍團配置、NPC＝常備軍抽調）。整數、下限 0。
        committedPopulation: { type: integer }
        # Task #400 — 近期每日軍力快照（遊戲日期由舊到新，最多 14 點；回合結算時寫入）。
        # 只含聚合軍隊人口值，不外洩兵種編制。
        armyTrend:
          type: array
          items: { $ref: "#/components/schemas/MapPoliticalArmyTrendPoint" }
        # Task #302 — 國庫金錢（player_nations.money），整數、下限 0。供國情面板比較與排序。
        money: { type: integer }
        # Task #302 — 科技點數（player_nations.tech_points），整數、下限 0。供國情面板比較與排序。
        techPoints: { type: integer }

    # Task #400 — 軍力趨勢單點：遊戲內日期（YYYY-MM-DD 字串，勿用 format: date）與當日軍隊人口。
    MapPoliticalArmyTrendPoint:
      type: object
      required: [date, armyPopulation]
      properties:
        date: { type: string }
        armyPopulation: { type: integer }

    MapPoliticalControl:
      type: object
      required: [regionId, nationId, percent, populationBonus]
      properties:
        regionId: { type: integer }
        nationId: { type: string }
        percent: { type: integer }
        populationBonus: { type: integer }

    MapPoliticalResponse:
      type: object
      required: [nations, controls]
      properties:
        nations:
          type: array
          items: { $ref: "#/components/schemas/MapPoliticalNation" }
        controls:
          type: array
          items: { $ref: "#/components/schemas/MapPoliticalControl" }

    MapCitiesResponse:
      type: object
      required: [totalCities, cities]
      properties:
        totalCities: { type: integer }
        cities:
          type: array
          items: { $ref: "#/components/schemas/MapCityEntry" }

    GameMusicTrack:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string }
        title: { type: string }
        url:
          type: string
          description: 站內串流網址（/api/storage/music/:id，支援 HTTP Range）

    GameMusicTracksResponse:
      type: object
      required: [tracks]
      properties:
        tracks:
          type: array
          items: { $ref: "#/components/schemas/GameMusicTrack" }

    WarCityView:
      type: object
      required:
        [
          cityId,
          name,
          wallTier,
          wallTierLabel,
          durability,
          maxDurability,
          durabilityPct,
        ]
      properties:
        cityId: { type: integer }
        name: { type: string, description: "城市中文名" }
        wallTier:
          type: string
          enum: [wood, stone, bunker, concrete]
          description: "城牆階級（開戰快照）"
        wallTierLabel: { type: string, description: "城牆階級中文標籤" }
        durability: { type: integer, description: "目前城牆耐久；0 = 該城陷落" }
        maxDurability: { type: integer, description: "該階級城牆耐久上限" }
        durabilityPct:
          type: integer
          description: "耐久百分比 0–100（durability/maxDurability）"

    WarCityStateView:
      type: object
      required: [cities, garrisoned]
      properties:
        cities:
          type: array
          description: "該地區逐城城牆狀態（含階級與耐久）"
          items: { $ref: "#/components/schemas/WarCityView" }
        garrisoned: { type: boolean }

    WarCampaignListItem:
      type: object
      required:
        [
          id,
          warId,
          role,
          opponentNationId,
          opponentName,
          attackerRegionId,
          attackerRegionName,
          defenderRegionId,
          defenderRegionName,
          status,
          winnerNationId,
          endReason,
          cycleNumber,
          cycleHours,
          nextResolveAt,
          createdAt,
          endedAt,
          isSeaLanding,
          landingAttackReductionPct,
          seaLandingTroopCap,
          isLead,
        ]
      properties:
        id: { type: integer }
        warId: { type: integer }
        role:
          type: string
          enum: [attacker, defender]
          description: 我方在此戰役中的角色
        isLead:
          type: boolean
          description: 我方是否為該邊主帥（false = 晚加入的參戰國）
        opponentNationId: { type: string }
        opponentName: { type: string }
        attackerRegionId: { type: integer }
        attackerRegionName: { type: string }
        defenderRegionId: { type: integer }
        defenderRegionName: { type: string }
        status:
          type: string
          enum: [active, ended]
        winnerNationId: { type: string, nullable: true }
        endReason:
          type: string
          nullable: true
          description: territory | ceasefire | nation_removed | stalemate
        cycleNumber: { type: integer }
        cycleHours: { type: integer }
        nextResolveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        isSeaLanding:
          type: boolean
          description: 是否為海上登陸戰役（跨海／跨洋登陸）
        landingAttackReductionPct:
          type: integer
          nullable: true
          description: 登陸攻擊力減損百分比（null = 非登陸戰役）
        seaLandingTroopCap:
          type: number
          nullable: true
          description: 海上登陸容許量（單場兵力上限；null = 非登陸戰役）

    WarCampaignsResponse:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/WarCampaignListItem" }

    WarInitiateCampaignRequest:
      type: object
      required: [attackerRegionId, defenderRegionId]
      properties:
        attackerRegionId: { type: integer, description: 己方控制的出發地區 }
        defenderRegionId: { type: integer, description: 相鄰且由交戰國控制的目標地區 }
        defenderNationId:
          type: string
          nullable: true
          description: 選填；多國混戰同區爭奪時，指定要爭奪的交戰敵國。未提供時預設取比例最高的交戰敵國。傳 null 表示明確要求攻打無人地帶（即使地區內有其他國家持分）。

    WarLegionUnitView:
      type: object
      required: [templateId, name, quantity, wounded]
      properties:
        templateId: { type: integer }
        name: { type: string, description: 顯示名稱（含玩家自訂名） }
        quantity: { type: number }
        wounded: { type: number }

    WarLegionView:
      type: object
      required: [slot, morale, supply, garrisoningCity, units]
      properties:
        slot:
          type: string
          enum: [A, B, C]
        morale: { type: integer }
        supply: { type: integer }
        garrisoningCity: { type: boolean }
        units:
          type: array
          items: { $ref: "#/components/schemas/WarLegionUnitView" }

    WarEnemyView:
      type: object
      required: [reconLevel, legionCount, totalTroops, totalWounded, averageMorale, armyTrend]
      properties:
        reconLevel:
          type: integer
          description: 0–3；最近週期內偵查指令次數，越高敵情越精確
        legionCount: { type: integer }
        totalTroops: { type: number, description: 模糊估計值 }
        totalWounded: { type: number, description: 模糊估計值 }
        averageMorale: { type: integer, description: 模糊估計值 }
        # Task #417 — 對手全國軍力快照趨勢（由舊到新，最多 14 點；每點依偵查等級
        # 套 fuzzValue 模糊化），只含聚合軍隊人口值，絕不外洩兵種編制。
        armyTrend:
          type: array
          items: { $ref: "#/components/schemas/MapPoliticalArmyTrendPoint" }

    WarAvailableUnit:
      type: object
      required: [templateId, name, owned, committed, woundedPool, available]
      properties:
        templateId: { type: integer }
        name: { type: string, description: 顯示名稱（含玩家自訂名） }
        owned: { type: number, description: 全國持有總量 }
        committed: { type: number, description: 已派往各前線（含前線傷兵） }
        woundedPool: { type: number, description: 全國傷兵池中數量 }
        available: { type: number, description: 尚可派遣數量 }

    WarOrderView:
      type: object
      required: [orderType, body]
      properties:
        orderType:
          type: string
          enum: [command, strategy, attack, defense, recon]
        body: { type: string }

    WarCeasefireInfo:
      type: object
      required: [proposedByNationId, proposedByMe]
      properties:
        proposedByNationId: { type: string, nullable: true }
        proposedByMe: { type: boolean }

    WarCampaignParticipantView:
      type: object
      required: [nationId, nationName, side, isLead, isNpc, isMe]
      properties:
        nationId: { type: string }
        nationName: { type: string }
        side:
          type: string
          enum: [attacker, defender]
        isLead: { type: boolean, description: 是否為該邊主帥 }
        isNpc: { type: boolean }
        isMe: { type: boolean }

    WarJoinEligibility:
      type: object
      required: [alreadyParticipant, joinableSides]
      properties:
        alreadyParticipant: { type: boolean }
        joinableSides:
          type: array
          items:
            type: object
            required: [side, sideLabel]
            properties:
              side:
                type: string
                enum: [attacker, defender]
              sideLabel: { type: string }

    WarJoinRequest:
      type: object
      required: [side]
      properties:
        side:
          type: string
          enum: [attacker, defender]
          description: 要加入的陣營

    WarJoinResult:
      type: object
      required: [ok, campaignId, side]
      properties:
        ok: { type: boolean }
        campaignId: { type: integer }
        side:
          type: string
          enum: [attacker, defender]

    WarCampaignDetail:
      allOf:
        - $ref: "#/components/schemas/WarCampaignListItem"
        - type: object
          required:
            [
              terrainBrief,
              attackerCityState,
              defenderCityState,
              myLegions,
              enemy,
              availableUnits,
              myOrders,
              ceasefire,
              participants,
            ]
          properties:
            participants:
              type: array
              description: 全部參戰國（含雙方主帥與晚加入者）
              items: { $ref: "#/components/schemas/WarCampaignParticipantView" }
            terrainBrief:
              type: string
              nullable: true
              description: AI 開戰時生成的地理與地形敘述（生成中為 null）
            attackerCityState:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/WarCityStateView"
            defenderCityState:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/WarCityStateView"
            myLegions:
              type: array
              items: { $ref: "#/components/schemas/WarLegionView" }
            enemy: { $ref: "#/components/schemas/WarEnemyView" }
            availableUnits:
              type: array
              items: { $ref: "#/components/schemas/WarAvailableUnit" }
            myOrders:
              type: array
              description: 本結算週期已提交的指令
              items: { $ref: "#/components/schemas/WarOrderView" }
            ceasefire: { $ref: "#/components/schemas/WarCeasefireInfo" }

    WarLegionsUpdateRequest:
      type: object
      required: [legions]
      properties:
        legions:
          type: array
          maxItems: 3
          items:
            type: object
            required: [slot, units]
            properties:
              slot:
                type: string
                enum: [A, B, C]
              garrisoningCity: { type: boolean }
              units:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [templateId, quantity]
                  properties:
                    templateId: { type: integer }
                    quantity: { type: number, minimum: 0 }

    WarLegionsUpdateResult:
      type: object
      required: [legions, availableUnits]
      properties:
        legions:
          type: array
          items: { $ref: "#/components/schemas/WarLegionView" }
        availableUnits:
          type: array
          items: { $ref: "#/components/schemas/WarAvailableUnit" }

    WarOrderRequest:
      type: object
      required: [orderType, body]
      properties:
        orderType:
          type: string
          enum: [command]
        body:
          type: string
          minLength: 1
          maxLength: 150

    WarReportSideView:
      type: object
      required:
        [moraleDelta, woundedTotal, deadTotal, territoryPctDelta, warWearinessDelta]
      properties:
        moraleDelta: { type: number }
        woundedTotal: { type: number }
        deadTotal: { type: number }
        territoryPctDelta: { type: number }
        warWearinessDelta: { type: number }

    WarReportView:
      type: object
      required:
        [
          id,
          cycleNumber,
          report,
          mySide,
          enemySide,
          attackerCityHoldoutPct,
          defenderCityHoldoutPct,
          attackerCities,
          defenderCities,
          localPopulationLoss,
          stalemate,
          createdAt,
        ]
      properties:
        id: { type: integer }
        cycleNumber: { type: integer }
        report: { type: string, description: 給我方看的完整敘事 }
        mySide: { $ref: "#/components/schemas/WarReportSideView" }
        enemySide:
          allOf:
            - $ref: "#/components/schemas/WarReportSideView"
          description: 敵方數值依當週期偵查等級模糊化
        attackerCityHoldoutPct: { type: number, nullable: true }
        defenderCityHoldoutPct: { type: number, nullable: true }
        attackerCities:
          nullable: true
          type: array
          description: 出發地區逐城城牆狀態（舊戰報為 null）
          items: { $ref: "#/components/schemas/WarCityView" }
        defenderCities:
          nullable: true
          type: array
          description: 目標地區逐城城牆狀態（舊戰報為 null）
          items: { $ref: "#/components/schemas/WarCityView" }
        localPopulationLoss: { type: number }
        stalemate: { type: boolean }
        createdAt: { type: string, format: date-time }

    WarReportsResponse:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/WarReportView" }

    CeasefireStatus:
      type: object
      required: [ok, warEnded, proposedByMe]
      properties:
        ok: { type: boolean }
        warEnded: { type: boolean, description: true = 戰爭已結束（接受停戰後） }
        proposedByMe: { type: boolean }


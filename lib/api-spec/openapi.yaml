        atWar: { type: boolean }
        unreadCount: { type: integer }
        hasConversed:
          type: boolean
          description: 我與該國之間是否存在任何往來訊息（送出或收到皆算，不限已讀）
        distance: { type: integer, nullable: true }

    DiplomacyNationsResponse:
      type: object
      required: [myNationId, myMoney, aiChatRemaining, aiChatCap, nations]
      properties:
        myNationId: { type: string }
        myMoney: { type: integer }
        aiChatRemaining:
          type: integer
          description: 本回合與 NPC 的剩餘可對話次數（所有 NPC 合計）
        aiChatCap:
          type: integer
          description: 每回合與 NPC 對話的總量上限
        nations:
          type: array
          items: { $ref: "#/components/schemas/DiplomacyNation" }

    DiplomacyMessage:
      type: object
      required: [id, fromMe, body, createdAt]
      properties:
        id: { type: integer }
        fromMe: { type: boolean }

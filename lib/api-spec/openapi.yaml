        availableBuildings:
          type: array
          description: 全部 6 種建築定義（含是否已解鎖、成本、維護費、加成）。
          items: { $ref: "#/components/schemas/AvailableBuilding" }
        regions:
          type: array
          items: { $ref: "#/components/schemas/EconomyRegion" }


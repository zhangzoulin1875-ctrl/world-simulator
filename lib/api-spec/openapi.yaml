components:
  schemas:
    DiscordSessionUser:
      type: object
      required: [discordUserId, username, globalName, avatar]
      properties:
        discordUserId: { type: string }
        username: { type: string }
        globalName: { type: string, nullable: true }
        avatar: { type: string, nullable: true }

    CurrentUser:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        user:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiscordSessionUser"

    PlayerNation:
      type: object
      required:
        [
          id,
          name,
          leaderName,
          flagUrl,
          emblemUrl,
          mapColor,
          government,
          techPoints,
          techPerTurn,
          production,
          productionTotal,
          productionSpent,
          population,
          populationGrowthPct,
          money,
          stability,
          unrest,
          warWeariness,
          woundedTotal,
          satisfactions,
          farmerPopulationPct,
          kanbanUrl,
          backgroundUrl,
          advisorStyle,
          advisorTips,
          dmDiplomacyEnabled,
          dmPoliticsEnabled,
          coupPolicyLockTurns,
          coupMoralePenaltyTurns,
          regions,
        ]
      properties:
        id: { type: string, description: "Nation uuid (decoupled from the owning player)" }
        name: { type: string, nullable: true }
        leaderName: { type: string, nullable: true }
        flagUrl: { type: string, nullable: true }
        emblemUrl: { type: string, nullable: true }
        mapColor:
          type: string
          nullable: true
          description: 玩家自訂地圖顏色（#rrggbb 小寫十六進位）。null = 未設定，前端依國家建立順序退回預設調色盤。
        government: { type: string, nullable: true }
        techPoints:
          type: integer
          description: Stored cumulative tech points (new players start at 0).
        techPerTurn:
          type: integer
          description: Computed — Σ(control percent × region current-era tech points); 0 if no regions controlled.
        production:
          type: integer
          description: Available production — computed Σ(control percent × region current-era productivity) minus production spent on military recruiting; clamped at 0.
        productionTotal:
          type: integer
          description: 本回合生產力總量（穩定度乘數 + 政策 + 生產科技加成後、未扣軍事佔用）。
        productionSpent:
          type: integer
          description: 已被軍事招募佔用的生產力。剩餘可用 = production；總量 = productionTotal。
        population:
          type: number
          description: Available population — computed Σ(control percent × region current-era population) plus accrued growth (population_bonus) minus population spent on military recruiting; clamped at 0.
        populationGrowthPct:
          type: number
          description: 有效人口增長率（%／回合）＝內政基礎增長率 + 政策/事件 populationGrowth 加減成，夾 ±上限。
        money: { type: number }
        stability:
          type: number
          description: 有效穩定度 0–100（基底 + 生效中內政條目加減成；最多小數點第一位）。
        unrest:
          type: integer
          description: 有效暴動度 0–100。
        warWeariness:
          type: integer
          description: 厭戰度 0–100（目前僅隨事件/結算變動，戰爭系統未落地）。
        woundedTotal:
          type: number
          description: "傷兵總數（全國傷兵池 + 進行中戰役前線傷兵；隨結算迴圈逐步歸隊）"
        satisfactions: { $ref: "#/components/schemas/PoliticsSatisfactions" }
        farmerPopulationPct:
          type: integer
          description: 農民人口比例 0–100（顯示用；工人比例 = 100 − 農民比例）。
        kanbanUrl:
          type: string
          nullable: true
          description: Player override → global default → null (frontend falls back to the shipped static asset).
        backgroundUrl:
          type: string
          nullable: true
          description: Player override → global default → null (frontend falls back to the shipped static asset).
        advisorStyle:
          type: string
          nullable: true
          description: 看板顧問自訂說話風格（人設）。null = 未設定，首頁閒置提示改用內建題庫。
        advisorTips:
          type: array
          description: 已產生的顧問小tips（繁體中文短句）。存說話風格時由 AI 一次生成；首頁閒置時隨機挑一則顯示。預設空陣列。
          items: { type: string }
        dmDiplomacyEnabled:
          type: boolean
          description: 外交 Discord 私訊通知開關（預設開啟）；關閉後外交事件不再私訊玩家。
        dmPoliticsEnabled:
          type: boolean
          description: 內政 Discord 私訊通知開關（預設開啟）；關閉後每回合內政結算摘要不再私訊玩家。
        coupPolicyLockTurns:
          type: integer
          description: "Task #584 — 政變後政策封鎖剩餘回合數（> 0 時無法提交政策／決策／設計兵種）"
        coupMoralePenaltyTurns:
          type: integer
          description: "Task #584 — 政變後士氣懲罰剩餘回合數（> 0 時戰役結算全軍士氣扣減）"
        regions:
          type: array
          description: 本國掌控的地區清單（依大區/種子順序排序）；未掌控任何地區時為空陣列。唯讀——地區歸屬由管理員指派。
          items:
            $ref: "#/components/schemas/ControlledRegion"

    ControlledRegion:
      type: object
      required: [regionId, name, macroRegion, percent]
      properties:
        regionId: { type: integer }
        name: { type: string, description: "地區名稱（zh-TW）" }
        macroRegion: { type: string, description: "所屬大區（zh-TW）" }
        percent:
          type: integer
          description: 掌控比例 1–100（同一地區可由多國分享掌控）。

    PlayerNationEnvelope:
      type: object
      required: [hasNation, nation]
      properties:
        hasNation: { type: boolean }
        nation:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerNation"

    RegionStatContribution:
      type: object
      required:
        [
          regionId,
          name,
          macroRegion,
          percent,
          population,
          productivity,
          techPoints,
          baseProductivity,
          productivityInvestBonus,
        ]
      properties:
        regionId: { type: integer }
        name: { type: string, description: "地區名稱（zh-TW）" }
        macroRegion: { type: string, description: "所屬大區（zh-TW）" }
        percent: { type: integer, description: "掌控比例 1–100" }
        population: { type: integer, description: "加權後人口貢獻（percent/100 × 地區人口）" }
        productivity: { type: integer, description: "加權後生產力貢獻" }
        techPoints: { type: integer, description: "加權後科技點數貢獻" }
        baseProductivity: { type: integer, description: "該時代地區基礎生產素質（era stat，未含投資加成）" }
        productivityInvestBonus: { type: integer, description: "地區投資累積生產素質加成（跨時代固定；0 = 無）" }

    StabilityModifierEntry:
      type: object
      required: [title, entryType, direction, value]
      properties:
        title: { type: string, description: "政策/傳統/變革/事件名稱" }
        entryType: { type: string, description: "policy|tradition|reform|event" }
        direction: { type: string, description: "law|culture|religion|rights" }
        value: { type: number, description: "淡化後的穩定度加減成（可正可負）" }

    ProductivityTechSource:
      type: object
      required: [name, pct]
      properties:
        name: { type: string, description: "科技節點名稱（zh-TW）" }
        pct: { type: number, description: "該節點的生產力加成（%）" }

    ProductivityBuildingSource:
      type: object
      required: [name, count, pct]
      properties:
        name: { type: string, description: "建築名稱（zh-TW）" }
        count: { type: integer, description: "同型建築數量" }
        pct: { type: number, description: "合計生產力加成（%）＝單棟 × 數量" }

    ProductionStatBreakdown:
      type: object
      required:
        [
          regionBase,
          treatyBonus,
          otherBonus,
          base,
          stabilityMult,
          policyPct,
          techPct,
          buildingPct,
          techSources,
          buildingSources,
          total,
          spent,
          armySpent,
          buildingSpent,
          remaining,
          recruitSpendThisTurn,
          recruitSpendLines,
          spentLines,
          buildingSpentLines,
        ]
      properties:
        regionBase: { type: integer, description: "地區加權基礎生產力合計（不含條約轉移）" }
        treatyBonus: { type: integer, description: "生效條約每回合生產力淨流量（可正負；廢約即停止）" }
        otherBonus: { type: integer, description: "其他持久生產力偏移（超事件／管理員；可正負）" }
        base: { type: integer, description: "基礎合計 = max(0, 地區加權 + 條約流量 + 其他偏移)" }
        stabilityMult: { type: number, description: "穩定度乘數（如 1.12）" }
        policyPct: { type: number, description: "政策/事件生產力加成（%）" }
        techPct: { type: number, description: "生產科技加成（%）" }
        buildingPct: { type: number, description: "建築加成（%）" }
        techSources:
          type: array
          description: 生產科技加成的來源清單（節點名稱＋%）
          items:
            $ref: "#/components/schemas/ProductivityTechSource"
        buildingSources:
          type: array
          description: 建築加成的來源清單（建築名稱＋數量＋合計 %）
          items:
            $ref: "#/components/schemas/ProductivityBuildingSource"
        globalMultiplierPct:
          { type: integer, description: "全域生產力基礎倍率（%；100 = 不縮放，管理員回合設定；最外層縮放）" }
        total: { type: integer, description: "本回合總量（未扣佔用）" }
        spent: { type: integer, description: "佔用合計（軍事 + 建築；production_spent）" }
        armySpent: { type: integer, description: "軍事佔用（Σ 軍隊 production_reserved）" }
        buildingSpent: { type: integer, description: "建築佔用（Σ 地區資源建築 production_reserved）" }
        remaining: { type: integer, description: "剩餘可用 = max(0, 總量 − 佔用 − 本回合招募花費)" }
        recruitSpendThisTurn:
          { type: integer, description: "Task #568 — 本回合招募花費合計（一次性流量，跨回合自動歸零；解散不退還）" }
        recruitSpendLines:
          type: array
          description: 本回合招募花費逐筆明細（新→舊）
          items:
            $ref: "#/components/schemas/RecruitSpendLine"
        spentLines:
          type: array
          description: 軍事已佔用的逐兵種明細（production_reserved 依模板彙總）
          items:
            $ref: "#/components/schemas/ProductionSpentLine"
        buildingSpentLines:
          type: array
          description: 建築已佔用的逐建築明細（region_buildings.production_reserved）
          items:
            $ref: "#/components/schemas/BuildingSpentLine"

    RecruitSpendLine:
      type: object
      required: [templateId, name, quantity, amount, createdAt]
      properties:
        templateId: { type: integer, description: "兵種模板 id" }
        name: { type: string, description: "兵種名稱" }
        quantity: { type: integer, description: "該筆招募數量" }
        amount: { type: integer, description: "該筆立即性生產力花費 = ⌈數量 × prodCostPer100 ÷ 100⌉" }
        createdAt: { type: string, description: "招募時間（ISO datetime）" }

    ProductionSpentLine:
      type: object
      required: [templateId, name, quantity, reserved]
      properties:
        templateId: { type: integer, description: "兵種模板 id" }
        name: { type: string, description: "兵種名稱" }
        quantity: { type: number, description: "該兵種持有數量合計" }
        reserved: { type: number, description: "該兵種佔用的生產力合計（production_reserved）" }

    BuildingSpentLine:
      type: object
      required: [buildingId, name, regionName, level, reserved]
      properties:
        buildingId: { type: integer, description: "建築 id" }
        name: { type: string, description: "建築名稱（如木材廠／礦場）" }
        regionName: { type: string, description: "所在地區名稱" }
        level: { type: integer, description: "建築等級" }
        reserved: { type: number, description: "該建築佔用的生產力（建造＋歷次升級累計）" }

    TechStatBreakdown:
      type: object
      required: [base, stabilityMult, policyPct, techBonusPct, total]
      properties:
        base: { type: integer, description: "地區加權基礎科技點數" }
        stabilityMult: { type: number, description: "穩定度乘數" }
        policyPct: { type: number, description: "政策/事件科技加成（%）" }
        techBonusPct: { type: number, description: "科技研發/建築加成（%）" }
        globalMultiplierPct:
          { type: integer, description: "全域科技點數基礎倍率（%；100 = 不縮放，管理員回合設定；最外層縮放）" }
        total: { type: integer, description: "每回合科技總產出" }

    PopulationGrowthTechSource:
      type: object
      required: [name, pct]
      properties:
        name: { type: string, description: "科技節點名稱" }
        pct: { type: number, description: "人口增長加成（百分點）" }

    PopulationGrowthBuildingSource:
      type: object
      required: [name, count, pct]
      properties:
        name: { type: string, description: "建築名稱" }
        count: { type: integer, description: "建築數量" }
        pct: { type: number, description: "合計人口增長加成（百分點）" }

    PopulationGrowthBreakdown:
      type: object
      required: [basePct, policyPct, techPct, buildingPct, buffPct, capAbsPct, effectivePct, techSources, buildingSources]
      properties:
        basePct: { type: number, description: "內政基礎人口增長率（%）" }
        policyPct: { type: number, description: "政策/事件人口增長加減成（百分點）" }
        techPct: { type: number, description: "科技樹人口增長加成（百分點）" }
        buildingPct: { type: number, description: "建築人口增長加成（百分點）" }
        buffPct: { type: number, description: "暫時人口 buff 增長加成（百分點）" }
        capAbsPct: { type: number, description: "人口增長率絕對值上限（%）" }
        effectivePct: { type: number, description: "有效人口增長率（夾在 ±上限）" }
        techSources:
          type: array
          description: 科技節點來源清單
          items:
            $ref: "#/components/schemas/PopulationGrowthTechSource"
        buildingSources:
          type: array
          description: 建築來源清單
          items:
            $ref: "#/components/schemas/PopulationGrowthBuildingSource"

    PopulationStatBreakdown:
      type: object
      required: [base, accruedGrowth, total, spent, remaining, growth]
      properties:
        base: { type: integer, description: "地區加權基礎人口" }
        accruedGrowth: { type: integer, description: "累積人口增長量（population_bonus）" }
        total: { type: integer, description: "總人口 = 地區加權基礎 + 累積增長量（下限 0）" }
        spent: { type: integer, description: "已被軍事招募佔用的人口" }
        remaining: { type: integer, description: "剩餘可用 = max(0, 總人口 − 佔用)" }
        growth: { $ref: "#/components/schemas/PopulationGrowthBreakdown" }

    PoliticsStatBreakdown:
      type: object
      required:
        [
          stabilityBase,
          stabilityEntries,
          stabilityEffective,
          unrest,
          warWeariness,
          satisfactions,
          satisfactionHighThreshold,
          satisfactionLowThreshold,
        ]
      properties:
        stabilityBase: { type: number, description: "穩定度基底值（國家列儲存值）" }
        stabilityEntries:
          type: array
          description: 逐條生效中政策/傳統/變革/事件對穩定度的（淡化後）加減成
          items:
            $ref: "#/components/schemas/StabilityModifierEntry"
        stabilityEffective: { type: number, description: "有效穩定度（基底 + 加減成，夾 0–100）" }
        unrest: { type: integer, description: "目前暴動度 0–100" }
        warWeariness: { type: integer, description: "目前厭戰度 0–100" }
        satisfactions: { $ref: "#/components/schemas/PoliticsSatisfactions" }
        satisfactionHighThreshold: { type: number, description: "滿意度高門檻（> 此值降暴動度）" }
        satisfactionLowThreshold: { type: number, description: "滿意度低門檻（< 此值大幅升暴動度）" }

    NationStatBreakdown:
      type: object
      required: [era, eraLabel, regions, production, tech, population, politics]
      properties:
        era: { type: string, description: "計算用數據時代代號" }
        eraLabel: { type: string, description: "數據時代名稱（zh-TW）" }
        regions:
          type: array
          description: 各掌控地區於該時代的加權貢獻（依大區/種子順序）
          items:
            $ref: "#/components/schemas/RegionStatContribution"
        production: { $ref: "#/components/schemas/ProductionStatBreakdown" }
        tech: { $ref: "#/components/schemas/TechStatBreakdown" }
        population: { $ref: "#/components/schemas/PopulationStatBreakdown" }
        politics: { $ref: "#/components/schemas/PoliticsStatBreakdown" }

    FoundingGovernment:
      type: object
      required: [slug, label, description, decisionDifficulty]
      properties:
        slug:
          type: string
          enum: [absolute_monarchy, aristocracy, parliamentary_republic]
        label: { type: string, description: "政體名稱（zh-TW）" }
        description: { type: string, description: "政體敘述（zh-TW）" }
        decisionDifficulty:
          type: integer
          description: "政治決策難度 0–100，越高越難通過決策"

    FoundNationRequest:
      type: object
      required: [name, leaderName, regionIds, government]
      properties:
        name: { type: string, description: "國名（1–25 字，僅允許文字與數字，不含空白與標點）" }
        leaderName: { type: string, description: "領導者名稱（1–40 字）" }
        regionIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 5
          description: "起始地區（1–5 塊，必須全部未被任何國家掌控；選 2–5 塊時生產力總和不得超過上限）"
        government:
          type: string
          enum: [absolute_monarchy, aristocracy, parliamentary_republic]
          description: "建國政體（三選一：君主專制／貴族制／議會共和制）"
        flagUrl: { type: string, nullable: true }
        emblemUrl: { type: string, nullable: true }

    UpdateNationRequest:
      type: object
      description: Omitted fields keep their value; null/empty string clears an image. government is not editable.
      properties:
        name: { type: string }
        leaderName: { type: string }
        flagUrl: { type: string, nullable: true }
        emblemUrl: { type: string, nullable: true }
        kanbanUrl: { type: string, nullable: true }
        backgroundUrl: { type: string, nullable: true }
        mapColor:
          type: string
          nullable: true
          description: 玩家自訂地圖顏色（#RRGGBB 十六進位色碼，存檔時轉小寫）；null/空字串清除（地圖退回預設調色盤）。
        advisorStyle:
          type: string
          nullable: true
          description: 看板顧問說話風格；null/空字串清除（首頁改用內建題庫）。
        dmDiplomacyEnabled:
          type: boolean
          description: 外交 Discord 私訊通知開關；true 開啟、false 關閉。
        dmPoliticsEnabled:
          type: boolean
          description: 內政 Discord 私訊通知開關；true 開啟、false 關閉。

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    GovernmentInfo:
      type: object
      required: [slug, label, description, recommended]
      properties:
        slug: { type: string }
        label: { type: string }
        description: { type: string }
        recommended: { type: boolean, description: "Recommended for the current era (sorted first)" }

    GovernmentsResponse:
      type: object

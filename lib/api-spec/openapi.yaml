        lockReason: { type: string, nullable: true, description: "鎖定原因（zh-TW；未鎖定為 null）" }
        customCount: { type: integer, description: "Player's custom units in this category (cap = customUnitLimit)" }

    MilitaryUnitTemplate:
      type: object
      required:
        [
          id,
          category,
          categoryLabel,
          name,
          description,
          customName,
          isDefault,
          isCustom,
          range,
          hp,
          attack,
          defense,
          speed,
          accuracy,
          antiCavalryPct,
          antiRangedPct,
          antiArtilleryPct,
          siegePct,
          prodCostPer100,
          popCostPerUnit,
          moneyCostPerUnit,
          upkeepPerUnit,
          prodUpkeepPerUnit,
          woodCostPerUnit,
          oreCostPerUnit,
          baseHp,
          baseAttack,
          baseDefense,
          baseSpeed,
          baseAccuracy,
        ]
      properties:
        id: { type: integer }
        category: { type: string }
        categoryLabel: { type: string }
        name: { type: string }
        customName: { type: string, nullable: true, description: "Player's personal display name; null = use name" }
        description: { type: string, nullable: true }
        isDefault: { type: boolean }
        isCustom: { type: boolean }
        range: { type: string, description: "melee | ranged" }
        hp: { type: integer, description: "Effective (tech-adjusted) value" }
        attack: { type: integer }
        defense: { type: integer }
        speed: { type: number }
        accuracy: { type: integer }
        antiCavalryPct: { type: integer }
        antiRangedPct: { type: integer }
        antiArtilleryPct: { type: integer, description: "Task #406 — 對火炮傷害加成 %" }
        siegePct: { type: integer }

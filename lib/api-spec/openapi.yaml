        oreCostPerUnit: { type: number, description: "Task #406 — 每單位招募礦石成本" }
        baseHp: { type: integer, description: "Un-adjusted base value" }
        baseAttack: { type: integer }
        baseDefense: { type: integer }
        baseSpeed: { type: number }
        baseAccuracy: { type: integer }

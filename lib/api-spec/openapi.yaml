          taxEfficiencyPct,
          totalPopulation,
          taxIncomePerTurn,
        ]
      properties:
        statsEra: { type: string, description: "數據時代 slug" }
        statsEraLabel: { type: string, description: "數據時代 zh-TW 名稱" }
        taxRatePct: { type: integer, description: "目前稅率（%）" }
        taxEfficiencyPct: { type: integer, description: "有效稅收效率（%）" }
        totalPopulation: { type: integer, description: "全國總人口（數據時代）" }
        taxIncomePerTurn:
          type: integer
          description: 每回合全國稅收（與財政總覽同一算式，各地區貢獻加總相等）。

    EconomyRegions:
      type: object
      required:
        [
          economy,

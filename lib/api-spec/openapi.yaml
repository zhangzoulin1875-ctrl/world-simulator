        "200":
          description: Message stored (plus NPC reply / relation update when target is NPC)
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/DiplomacySendMessageResponse" }
        "400":
          description: Validation error / not a chattable nation / turn chat quota exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          description: Not logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Nation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "502":

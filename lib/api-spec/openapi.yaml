        relationDelta:
          type: integer
          nullable: true
          description: 本次對話 AI 判定的關係值增減（−20～+20）；玩家對話時為 null
        aiChatRemaining:
          type: integer
          nullable: true
          description: 本回合與 NPC 的剩餘可對話次數；玩家對話時為 null
        aiChatCap:
          type: integer
          nullable: true
          description: 每回合與 NPC 對話的總量上限；玩家對話時為 null
        actions:
          type: array
          nullable: true
          description: 與 NPC 對話時 NPC 即時採取的外交／軍事動作結果；無動作或玩家對話時為空陣列或 null
          items:
            $ref: "#/components/schemas/DiplomacyChatAction"

    DiplomacyChatAction:
      type: object
      required: [type, targetId, targetName, ok, detail]
      properties:
        type:
          type: string
          description: 動作類型（declare_war/initiate_campaign/ceasefire/propose_treaty/alliance/gift/exchange）
        targetId:
          type: string
          description: 目標國家 id
        targetName:
          type: string
          nullable: true
          description: 目標國家名稱
        ok:

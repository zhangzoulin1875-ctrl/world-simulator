          type: integer
          description: "升級到此階級所需金錢（木牆為 0，預設起點）"

    UpgradeCityWallRequest:
      type: object
      required: [tier]
      properties:
        tier:
          type: string
          enum: [stone, bunker, concrete]
          description: "要升級到的目標階級（須為目前階級的下一階）"

    UpgradeCityWallResult:
      type: object
      required: [cityId, tier, tierLabel, maxDurability, defenseBonusPct, money]
      properties:
        cityId: { type: integer }
        tier:
          type: string
          enum: [wood, stone, bunker, concrete]
        tierLabel: { type: string }
        maxDurability: { type: integer }
        defenseBonusPct: { type: integer }
        money: { type: integer, description: "扣除升級成本後的餘額" }

    EconomyRegion:
      type: object
      required:
        [
          regionId,
          name,
          macroRegion,
          percent,
          population,
          productionQuality,
          productionContribution,
          taxContribution,
          cities,
          investment,
        ]
      properties:
        regionId: { type: integer }
        name: { type: string, description: "地區中文名" }
        macroRegion: { type: string, description: "所屬大區" }
        percent: { type: integer, description: "掌控百分比 1–100" }
        population:
          type: integer
          description: 該地區人口貢獻（數據時代加權人口 + 累積成長量，下限 0）。
        productionQuality:
          type: integer
          nullable: true
          description: 該地區在數據時代的生產素質（原始地區數值；缺該時代數據為 null）。
        productionContribution:
          type: integer
          description: 該地區生產力貢獻（生產素質 × 控制比例 × 地區人口 ÷ 1,000,000）。
        taxContribution:
          type: integer
          description: 該地區每回合稅收貢獻（依人口比例以最大餘數法分配，Σ = 全國稅收）。
        cities:
          type: array
          items: { $ref: "#/components/schemas/EconomyCity" }
        investment:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionInvestmentInfo"
          description: 生產力投資資訊（該時代無數據時為 null）。

    RegionInvestmentInfo:
      type: object
      required:
        [
          baseProductivity,
          investmentBonus,
          effectiveProductivity,
          population,
          avgEffectiveProductivity,
          costMultiplier,
          nextInvestCost,
        ]
      properties:
        baseProductivity:
          type: integer
          description: 數據時代的地區生產素質（era stat，未含投資加成）。
        investmentBonus:
          type: integer
          description: 投資累積加成（+1/次；全地區共享、跨時代固定）。
        effectiveProductivity:
          type: integer
          description: 有效生產素質 = era stat + 投資累積加成。
        population:
          type: integer
          description: 地區目前人口（era stat + 累積成長量；投資基礎費用）。
        avgEffectiveProductivity:
          type: number
          description: 全世界平均有效生產素質（顯示用，≤1 位小數）。
        costMultiplier:
          type: number
          description: 費用倍率 = 有效生產素質 ÷ 全球平均（下限 1；顯示用 2 位小數）。
        nextInvestCost:
          type: integer
          description: 下一次投資費用 = ceil(人口 × 倍率)。

    InvestRegionProductivityRequest:
      type: object
      required: [regionId]
      properties:
        regionId: { type: integer }

    InvestRegionProductivityResult:
      type: object
      required:
        [
          cost,
          money,
          investmentBonus,
          effectiveProductivity,
          nextInvestCost,
          costMultiplier,
        ]
      properties:
        cost: { type: integer, description: "本次實際扣款金額" }
        money: { type: integer, description: "扣款後餘額" }
        investmentBonus: { type: integer, description: "投資後的累積加成" }
        effectiveProductivity: { type: integer, description: "投資後的有效生產素質" }
        nextInvestCost: { type: integer, description: "下一次投資費用（已反映新排名）" }
        costMultiplier: { type: number, description: "下一次費用倍率（2 位小數）" }


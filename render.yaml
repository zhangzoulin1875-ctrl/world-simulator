# Render Blueprint：架空世界模擬器（Docker 單一服務 + PostgreSQL）
# 部署時 Render 會提示輸入 sync:false 的機密變數。
services:
  - type: web
    name: world-simulator
    runtime: docker
    plan: starter # 免費方案；搭配外部 ping 防休眠。要全天穩定跑可改 standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: world-sim-db
          property: connectionString
      - key: AI_INTEGRATIONS_ANTHROPIC_BASE_URL
        value: https://api.anthropic.com
      - key: AI_INTEGRATIONS_ANTHROPIC_API_KEY # 你的 Anthropic API key（非 Replit 代理）
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: ADMIN_TOKEN # 管理員後台密碼，自訂一串隨機字
        sync: false
      - key: NEWS_SCHEDULE_TZ
        value: Asia/Taipei
      - key: LOG_LEVEL
        value: info

databases:
  - name: world-sim-db
    plan: free # ⚠️ 免費 Postgres 30 天後會被刪除——要長期玩，請改 starter（約 $7/月）
    databaseName: world_sim
    user: world_sim

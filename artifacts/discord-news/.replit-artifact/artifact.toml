kind = "web"
previewPath = "/"
title = "Discord News"
version = "1.0.0"
id = "artifacts/discord-news"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23869

[services.development]
run = "pnpm --filter @workspace/discord-news run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/discord-news", "run", "build" ]
publicDir = "artifacts/discord-news/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23869"
BASE_PATH = "/"
